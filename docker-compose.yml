# NEU-Compass production stack — NAS deploy target.
#
# Layout (relative to this file's directory on the NAS):
#   ./runtime-data/        bind-mounted to /data inside api + backup
#     ├── courses.db        SQLite (source of truth, ADR-0013)
#     ├── faiss_index/      FAISS IndexIDMap (rebuildable from SQLite)
#     ├── openvino/         fp16 OpenVINO IR (embedder + reranker)
#     ├── openvino_int8/    ADR-0017 production set: int8 reranker +
#     │                     embedder symlink → ../openvino/embedder
#     └── onnx/
#         ├── embedder/     bge-m3 FP16 ONNX (~1.1GB)
#         └── reranker/     bge-reranker-v2-m3 FP16 ONNX (~570MB)
#   ./cloudflared/         bind-mounted to /etc/cloudflared (config + creds)
#   .env                   loaded by api for GEMINI_API_KEY, OAuth, etc.
#
# Cloudflared config.yml on the NAS should route to compose service names:
#   ingress:
#     - hostname: api.neu-compass.me
#       service: http://api:8000
#     - hostname: compass.neu-compass.me
#       service: http://web:8080           # since R7's switch
#       originRequest:
#         connectTimeout: 30s
#         noTLSVerify: false
#     - hostname: beta.neu-compass.me      # R7's beta: the same front end, for two weeks after the switch
#       service: http://web:8080
#     - service: http_status:404

# Bounded container logs: the api emits one JSON line per request and
# cloudflared is chatty — the default json-file driver grows UNBOUNDED
# on a 24/7 NAS unless capped here (UGOS ships no daemon.json cap).
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    image: neu-compass:latest
    container_name: neu-compass-api
    restart: always
    logging: *bounded-logging
    env_file: .env
    environment:
      # === Inference: optimum-intel direct OpenVINO IR (Iris Xe iGPU on i5-1235U) ===
      # Replaces the onnxruntime-openvino path. Direct OpenVINO IR export
      # via `optimum-cli export openvino` sidesteps the u8 GatherND issue
      # that blocked Intel GPU compile on the ONNX route. See
      # rag/openvino_backend.py + scripts/export_openvino.py.
      INFERENCE_BACKEND: openvino
      # /data/openvino_int8: int8 reranker (NNCF, 570MB) + symlinked fp16
      # embedder. ADR-0017: pool 10 + int8 → p50 2019→849ms, R@5 unchanged.
      # Export ran in-container: docker run --rm -v .../runtime-data:/data
      #   -e HF_HOME=/data/.hf_cache neu-compass:latest optimum-cli export
      #   openvino --model BAAI/bge-reranker-v2-m3 --weight-format int8
      #   --trust-remote-code /data/openvino_int8/reranker
      OPENVINO_MODEL_DIR: /data/openvino_int8
      OPENVINO_DEVICE: GPU                       # Iris Xe; fallback CPU if iGPU absent
      OPENVINO_CACHE_DIR: /data/openvino_cache   # persists compiled GPU kernels (first boot ~60s → subsequent ~5s)
      ENABLE_RERANKER: "true"                    # NAS has 32GB dual-channel
      RERANK_POOL_SIZE: "10"                     # ADR-0017: 20→10, quality-neutral, halves rerank latency
      REJECTION_MODE: calibrated                 # ADR-0018: logistic gate (sigmoid+BM25+vec+code-miss) replaces bare T=0.05
      HYDE_RESCUE: "true"                        # ADR-0019: LLM second-opinion + HyDE retry for gate-rejected queries only
      FUSION_MODE: convex                        # ADR-0022: score-aware min-max fusion beats RRF on v0.3 sweep
      FUSION_WEIGHT: "0.7"                       # vector leg share; sweep plateau w∈[0.5,0.7], best cell 0.7 @ α=0.4
      # === Storage paths (bind-mounted volume) ===
      SQLITE_PATH: /data/courses.db
      FAISS_INDEX_PATH: /data/faiss_index
      # Persist the HF cache on the volume: OvEmbedder/OvReranker load
      # tokenizers by hub id (AutoTokenizer.from_pretrained("BAAI/...")),
      # and without this every container recreation re-downloads them —
      # and hard-fails the lifespan (api never healthy, whole stack down)
      # if huggingface.co is unreachable at that moment. The in-container
      # model exports already populated /data/.hf_cache.
      HF_HOME: /data/.hf_cache
      # === Logging ===
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # === OAuth callback must be the public URL, not localhost ===
      # The redirect GET /auth/login-url and POST /auth/callback use when a
      # client names none (the Streamlit page relied on that until R8); the
      # web front end always names its own root, one of WEB_ORIGINS below.
      # Must byte-match a URI registered in Google Cloud Console — Google
      # rejects any difference, trailing slash included.
      GOOGLE_OAUTH_REDIRECT_URI: https://compass.neu-compass.me/
      # === Small trial (batch T, 10-21; the user chose these policies) ===
      # P3: question text becomes its keyed hash after 90 days, and saved answers are deleted after 90 days;
      # needs SESSION_SECRET from .env.
      QUERY_LOG_RETENTION_DAYS: "90"
      # P5: Gemini calls per UTC day (chat answers + HyDE rescues); then /chat streams a fixed notice.
      MODEL_DAILY_CALL_LIMIT: "200"
      # P6: 👍/👎 with a per-session opt-in that starts unticked.
      ANSWER_FEEDBACK_ENABLED: "true"
      # P4: GET /privacy (R2a) shows the address on the web's 数据与隐私 page.
      PRIVACY_CONTACT_EMAIL: shen.haow@northeastern.edu
      # R7: the web front end's origins (a JSON list), which CORS answers, which may send writes with the session
      # cookie, and whose root Google may send a browser back to (Google Cloud Console must list it too). compass
      # since the switch, and the beta for the two weeks it stays. Set here, not in .env: compose's environment
      # wins over env_file, so this is what runs.
      WEB_ORIGINS: '["https://compass.neu-compass.me", "https://beta.neu-compass.me"]'
      # P5: one process-wide budget for POST /search and /chat (not per user, not a cost quota). Not measured on
      # the NAS: 4 at once ≈ two chat streams + two searches; burst 20; 0.5/s ≈ 30 a minute site-wide.
      REQUEST_GUARD_ENABLED: "true"
      REQUEST_GUARD_CAPACITY: "20"
      REQUEST_GUARD_REFILL_PER_SECOND: "0.5"
      REQUEST_GUARD_MAX_INFLIGHT: "4"
    volumes:
      - ./runtime-data:/data
    devices:
      - /dev/dri:/dev/dri          # expose Iris Xe iGPU to OpenVINO EP
    group_add:
      - "44"                       # video (host GID on UGOS)
      - "105"                      # render (host GID on UGOS)
    ports:
      - "8000:8000"                # exposed on NAS LAN/Tailscale for debug
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s           # ONNX warm + first OpenVINO compile

  web:
    # R7: the React front end (web/Dockerfile): a build of web/, served by nginx with no access log and the build's
    # security headers. Built here on the NAS, as the api is. compass and the beta both route to it since the switch;
    # the Streamlit service beside it went in R8. Nothing waits for it, so a web that starts but is not healthy keeps
    # nothing else down. Its build is another matter: `up --build` builds every image before it starts any, so a web
    # build that fails stops the whole deploy, the api's included.
    # 中文：新前端。在 NAS 上构建；切换以后 compass 和 beta 都指向它，原来旁边的 Streamlit 服务 R8 删了。没有服务等它：
    # 它起来了但不健康，不影响别的服务。构建不一样：`up --build` 先构建所有镜像再起容器，web 构建失败整次部署都停，API 也
    # 上不去。
    build:
      context: ./web
      args:
        # The API a page calls, and the site its shared links name: compass since the switch (R7 plan, decision 2;
        # the beta's own before it). The beta serves this build too, so a link copied there names compass.
        VITE_API_BASE_URL: https://api.neu-compass.me
        VITE_PUBLIC_BASE_URL: https://compass.neu-compass.me
    image: neu-compass-web:latest
    container_name: neu-compass-web
    restart: always
    logging: *bounded-logging
    # nginx as user 101 (the image's), writing nothing but /tmp (its pid and temp files).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8510:8080"                # on the NAS LAN/Tailscale, for deploy.ps1's probe, as 8000 is
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    # Daily SQLite snapshot sidecar (scripts/backup_daemon.py). A compose
    # service, NOT host cron: host-level config doesn't survive UGOS updates
    # (see the 2026-07-02 outage notes on cloudflared). Reuses the app image —
    # zero extra build; restart: always resurrects it with the stack.
    image: neu-compass:latest
    container_name: neu-compass-backup
    restart: always
    logging: *bounded-logging
    command: ["python", "scripts/backup_daemon.py"]
    volumes:
      - ./runtime-data:/data
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    # Digest-pinned (2026-07-02 outage post-mortem): :latest is a drift
    # bomb on a 24/7 box. This is the digest that has run since May.
    image: cloudflare/cloudflared@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: neu-compass-cloudflared
    # root on purpose: the UGOS Docker update re-applied volume ACLs that
    # deny non-root reads on /volume1/docker/** — the image's default
    # nonroot user (65532) could no longer read the tunnel credentials
    # and the container crash-looped (public 530 for ~5h). Container-
    # scoped root is acceptable for this single-purpose tunnel client.
    user: "0"
    # always (not unless-stopped): the UGOS Docker-package update STOPS
    # containers explicitly, and unless-stopped then never restarts them.
    restart: always
    logging: *bounded-logging
    # Tunnel by UUID, not name: name resolution needs cert.pem + an API
    # round-trip on every cold start; the UUID + credentials-file path
    # has no such dependency.
    command: tunnel --no-autoupdate run ce52553f-7fc3-48dc-923d-3dd9ea772f06
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    # The api only (R7, decision 5): a web front end that is not healthy does not keep the tunnel down, and with it
    # the API. Its hostnames answer 502 until it is.
    depends_on:
      api:
        condition: service_healthy
