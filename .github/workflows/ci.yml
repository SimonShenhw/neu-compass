name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/openapi-types/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install the API type generator
        run: npm ci --prefix tools/openapi-types
      - name: Check the generated API types match openapi.json
        run: npm run gen:api:check
      - name: Check formatting
        run: npm run format:check
      - name: Check types, lint, tests and build
        run: npm run check

  # R6: Playwright in Chromium's headless shell, against a build for the dev API (tests/support/dev_api.py, synthetic
  # data and a fake Google only), with answer feedback on as production has it. Playwright starts both servers
  # (web/tools/e2e/playwright.config.ts). 中文：用 Chromium 无头版跑端到端测试，对着开发 API 的构建（只有合成数据和
  # 假 Google），回答反馈照生产开着。
  e2e:
    name: End-to-end tests
    # Pinned, not ubuntu-latest (26.04 since 10-28): the fonts and libraries the layout tests run with do not change
    # with a new major version, though the image and the apt packages --with-deps installs are still updated within
    # this one. Playwright 1.64 supports both.
    runs-on: ubuntu-24.04
    env:
      # The dev API imports config.settings, which requires it; never sent anywhere (see the test job).
      GEMINI_API_KEY: ci-placeholder-not-a-secret
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the API's dependencies
        working-directory: .
        run: uv sync --frozen --extra dev
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/e2e/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright
        run: npm ci --prefix tools/e2e
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: web/tools/e2e/.browsers
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('web/tools/e2e/package-lock.json') }}
      - name: Install the headless shell and the system libraries it needs
        run: npm run browser --prefix tools/e2e -- --with-deps
      - name: Check the end-to-end tests' types
        run: npm run typecheck --prefix tools/e2e
      - name: Build the site for the dev API
        run: npm run build:dev-api
      - name: Run the end-to-end tests
        run: npm test --prefix tools/e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/tools/e2e/playwright-report/
            web/tools/e2e/test-results/
          retention-days: 7

  # R7: the web front end's image as compose builds and runs it on the NAS (web/Dockerfile, docker-compose.yml's web
  # service: its build arguments, read-only root, health check), checked from outside: every kind of response and its
  # headers (web/deploy/check-site.ts), nginx as user 101, and no request in the log. Nothing reaches the NAS.
  # 中文：照 NAS 上 compose 的做法构建、运行新前端的镜像，从外面核对每类响应和它的头、nginx 以 101 用户运行、
  # 日志里没有请求。不碰 NAS。
  web-image:
    name: Web image
    # Pinned, as the e2e job is.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and start the web service as compose has it
        # Compose reads the api's env_file even to start only web: an empty one, which web never reads.
        run: |
          touch .env
          docker compose up --build --detach --wait --wait-timeout 180 web
      - name: Check what it serves
        # The API and the site its shared links name, as compose's build arguments give them.
        run: node web/deploy/check-site.ts http://127.0.0.1:8510 https://api.neu-compass.me https://beta.neu-compass.me
      - name: Check it runs nginx as user 101 and logged no request
        run: |
          test "$(docker compose exec -T web id -u)" = 101
          docker compose logs --no-log-prefix web > web.log
          cat web.log
          if grep -E 'GET |HEAD |HTTP/1\.|/course/|/assets/|/healthz' web.log; then
            echo "::error::the web container logged a request"
            exit 1
          fi
      - name: Show its log
        if: failure()
        run: docker compose logs web

  test:
    name: Test & Integrity Checks
    runs-on: ubuntu-latest
    env:
      # config.settings requires GEMINI_API_KEY at import time and CI has no
      # .env (gitignored). A non-secret placeholder lets Settings() construct;
      # offline tests stub every model/LLM call and `-m "not live"` skips the
      # network suite, so this value is never sent anywhere.
      # 中文：config.settings 导入时要求 GEMINI_API_KEY，而 CI 没有 .env（已
      # gitignore）。占位值只为让 Settings() 能构造；离线测试替身了所有模型/LLM
      # 调用，live 用例被 -m "not live" 排除，这个值不会被发往任何地方。
      GEMINI_API_KEY: ci-placeholder-not-a-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify uv.lock consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify production dependencies & wheel integrity
        run: uv run pytest tests/test_production_dependencies.py -v

      - name: Execute disaster recovery rehearsal
        run: uv run python scripts/rehearse_recovery.py --json

      # R2b: the web front end generates its types from web/openapi.json; an API change must come with a new export.
      # 中文：新前端从 web/openapi.json 生成类型；改了接口就要重新导出。
      - name: Check web/openapi.json matches the API
        run: uv run python scripts/export_openapi.py --check

      - name: Run offline test suite
        run: uv run pytest -m "not live" --tb=short
