name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Integrity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify uv.lock consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify production dependencies & wheel integrity
        run: uv run pytest tests/test_production_dependencies.py -v

      - name: Execute disaster recovery rehearsal
        run: uv run python scripts/rehearse_recovery.py --json

      - name: Run offline test suite
        run: uv run pytest -m "not live" --tb=short
