# R7: the site as the web image serves it (web/Dockerfile puts this file at /etc/nginx/conf.d/default.conf). The build
# of web/ is in /srv/www: every page path is answered with index.html, the hashed files under /assets/ are cached for
# good, and nothing is logged per request (a page path names the course a student looked at).
# The security headers come from the build (deploy/securityHeaders.ts, written into security-headers.conf by
# deploy/render-headers.ts). The server includes them for the answers nginx makes before any location, and each
# location includes them again: a location with an add_header of its own inherits none from the server.
# 中文：网页镜像里的站点。web/ 的构建在 /srv/www：所有页面路径都回 index.html，/assets/ 下带哈希的文件长缓存，
# 不按请求记日志（页面路径里有学生看过的课号）。安全头来自构建：server 这层 include 一次，给 nginx 在进 location
# 以前就回的答复；每个 location 再 include 一次：location 里只要有自己的 add_header，就不继承 server 的。
server {
    listen 8080;
    server_name _;
    root /srv/www;

    server_tokens off;
    access_log off;
    # Errors only, and a missing file is not one: a 404 says nothing in the log, its path included.
    error_log /dev/stderr error;
    log_not_found off;
    # No limit on a request body, which nothing here reads (a POST is a 405, a GET with one is still the page): over the
    # default 1 MiB, the answer would be a 413 whose request line, path included, nginx logs as an error.
    client_max_body_size 0;
    charset utf-8;
    # No gzip: Cloudflare compresses for the browser, and between it and nginx is the NAS's own network.

    # A malformed request, a URI or a header too long: nginx answers before any location, with these.
    include /etc/nginx/security-headers.conf;

    # Built files under hashed names, never changed under the same name. A name that is not there is a 404, never
    # index.html, and is not cached: a page left open across a deploy then fails to load its old chunk plainly.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Compose's health check and deploy.ps1's probe.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every other path is the app's: a file at the build's root (the icon), else index.html. Checked again on every
    # load (no-cache still lets the browser revalidate with its ETag), so a new build is seen at once.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
